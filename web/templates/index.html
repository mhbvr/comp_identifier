{{template "head" "Component identifier"}}
<style>
  main { display: flex; flex-wrap: wrap; gap: 1rem; padding: 1rem; align-items: flex-start; }
  .view { position: relative; flex: 1 1 32rem; min-width: 0; background: #000; line-height: 0; }
  .view img { width: 100%; height: auto; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #overlay polygon { fill: none; stroke-width: 4; vector-effect: non-scaling-stroke; }
  .working { stroke: var(--working); color: var(--working); }
  .reliable { stroke: var(--reliable); color: var(--reliable); }
  .unreliable { stroke: var(--unreliable); color: var(--unreliable); }
  #result { flex: 0 1 24rem; min-width: 16rem; background: #fff; padding: 1rem; border-radius: 6px; }
  .status { font-weight: 600; margin: 0 0 .6rem; }
  .text { font: 600 1.5rem/1.25 ui-monospace, monospace; margin: .4rem 0; white-space: pre-line; }
  figure { margin: .6rem 0; }
  figure img { max-width: 100%; max-height: 16rem; border: 1px solid #ddd; display: block; }
  figcaption { color: var(--muted); font-size: .8rem; }
  .claude { border-top: 1px solid #ddd; margin-top: .8rem; padding-top: .6rem; }
  .claude h2 { font: 600 1.2rem/1.3 ui-monospace, monospace; margin: 0 0 .3rem; }
  .claude p { margin: .25rem 0; }
  .inventory { border-top: 1px solid #ddd; margin-top: .8rem; padding-top: .6rem; }
  .inventory h2 { font: 600 1.2rem/1.3 ui-monospace, monospace; margin: 0 0 .3rem; }
  .inventory p { margin: .25rem 0; }
  .inventory .cid { font: .85rem system-ui, sans-serif; color: var(--muted); white-space: nowrap; }
  .inventory .known { display: flex; gap: .6rem; align-items: flex-start; }
  .inventory .others { margin-top: .5rem; }
  .inventory .added { color: var(--reliable); font-weight: 600; }
  .inventory .added-cid { font-size: 1.1rem; }
  .inventory .added-cid strong { font: 700 2rem/1.2 ui-monospace, monospace; margin-left: .3rem; }
  .thumb { width: 64px; height: 48px; object-fit: contain; border: 1px solid #ddd; background: #fff; flex: none; }
  .hint { white-space: nowrap; }
</style>
</head>
<body>
{{if .HasInventory}}{{template "nav" "camera"}}{{else}}<header><strong>Component identifier</strong></header>{{end}}
<main>
  <div class="view">
    <img src="/live.mjpeg" alt="live camera view">
    {{template "overlay" .}}
  </div>
  {{template "result" .}}
</main>
<script>
  // Identify the component on screen with Claude: button or the "i" key.
  function askClaude() {
    const b = document.getElementById("claude-btn");
    if (b && !b.disabled) fetch("/claude/" + b.dataset.id, { method: "POST" });
  }
  // Add the part to the database: an "Add" button, or the "a" key for the
  // first one (the best match, else Claude's part as a new component).
  function addItem(b) {
    if (!b || b.disabled) return;
    b.disabled = true;
    const body = new URLSearchParams({ component: b.dataset.component });
    fetch("/add/" + b.dataset.id, { method: "POST", body });
  }
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "i") askClaude();
    if (e.key === "a") addItem(document.querySelector("button.add"));
  });

  // Re-render the dynamic parts (#overlay, #result) from /panel.
  let last = "";
  setInterval(async () => {
    try {
      const html = await (await fetch("/panel")).text();
      if (html === last) return;
      last = html;
      const t = document.createElement("template");
      t.innerHTML = html;
      for (const el of [...t.content.children]) document.getElementById(el.id).replaceWith(el);
    } catch (e) { /* server restarting: try again next tick */ }
  }, 300);
</script>
</body>
</html>
